<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Privacy policy update</title>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="popup-body">
  <h2>We updated our privacy policy</h2>
  <p>We now list every subprocessor we use and where it stores data. Nothing changes in how we handle your files.</p>
  <button type="button" class="popup-button">Got it</button>
  <script>
    document.querySelector(".popup-button").addEventListener("click", () => {
      window.parent.postMessage("close-popup", "*")
    })
  </script>
</body>
</html>
